<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Executive Strategy Brief</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #0b0e14;
    --surface: #121722;
    --surface-2: #192030;
    --fg: #eef2f8;
    --muted: #94a0b8;
    --border: #252f42;
    --accent: #6366f1;
    --accent-fg: #ffffff;
    --c1: #60a5fa;
    --c2: #34d399;
    --c-ok: #22c55e;
    --c-bad: #f87171;
    --c-wrn: #fbbf24;
  }
  [data-theme="light"] {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #f0f4fa;
    --fg: #0f172a;
    --muted: #5b677d;
    --border: #dce3ef;
    --accent: #4f46e5;
    --accent-fg: #ffffff;
    --c1: #2563eb;
    --c2: #059669;
    --c-ok: #16a34a;
    --c-bad: #dc2626;
    --c-wrn: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }
  /* Lock Screen */
  .lock-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lock-card {
    width: 100%;
    max-width: 410px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .lock-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--c1);
    background: var(--surface-2);
    padding: 4px 9px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .lock-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .lock-card p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .lock-input {
    width: 100%;
    padding: 11px 13px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--fg);
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  .lock-input:focus { border-color: var(--accent); }
  .lock-btn {
    width: 100%;
    padding: 11px 16px;
    border-radius: 9px;
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .lock-btn:disabled { opacity: 0.6; cursor: wait; }
  .lock-err {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--c-bad);
    min-height: 18px;
  }
  .lock-foot {
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  /* App Shell */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .brand-title { font-size: 15px; font-weight: 700; }
  .brand-meta { font-size: 11.5px; color: var(--muted); }
  .topbar-actions { display: flex; gap: 8px; }
  .btn-ghost {
    padding: 6px 11px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--fg);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .danger-txt { color: var(--c-bad); }

  .layout {
    max-width: 1260px;
    margin: 0 auto;
    padding: 22px 20px 60px;
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; }
    .sidenav {
      position: static !important;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .nav-link { padding: 6px 10px !important; }
  }
  .sidenav {
    position: sticky;
    top: 74px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }
  .nav-link {
    display: block;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
  }
  .nav-link:hover { color: var(--fg); background: var(--surface-2); }
  .nav-link.active { color: var(--accent-fg); background: var(--accent); }

  .content { display: flex; flex-direction: column; gap: 20px; }
  .sec { scroll-margin-top: 80px; display: flex; flex-direction: column; gap: 14px; }

  .hero-callout {
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 22px;
  }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--c1); margin-bottom: 6px; }
  .hero-callout h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; line-height: 1.25; }
  .hero-callout p { font-size: 13.5px; color: var(--fg); opacity: 0.94; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .kpi { padding: 16px; }
  .kpi-lbl { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .kpi-num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 22px; font-weight: 800; margin-top: 4px; }
  .kpi-note { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .pos { color: var(--c-ok); font-weight: 600; }
  .neg { color: var(--c-bad); font-weight: 600; }
  .wrn { color: var(--c-wrn); font-weight: 600; }
  .muted { color: var(--muted); font-size: 12.5px; }

  h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
  h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .chart-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .chart-svg { width: 100%; height: 230px; display: block; }

  .table-scroll { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; white-space: nowrap; }
  th.r, td.r { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  tr.row-total td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--border); }
  tr.row-sub td { font-weight: 600; color: var(--muted); }
  .footnote { margin-top: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  .bar-group { display: flex; flex-direction: column; gap: 12px; }
  .bar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; gap: 8px; flex-wrap: wrap; }
  .bar-dual { display: flex; flex-direction: column; gap: 3px; background: var(--surface-2); padding: 4px; border-radius: 6px; }
  .bar-dual > div { height: 9px; border-radius: 4px; }

  .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 820px) { .two-col, .three-col { grid-template-columns: 1fr; } }

  .subcard {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    font-size: 12.5px;
  }
  .step-pill {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--c1);
    margin-bottom: 5px;
  }
  .clean-list { padding-left: 16px; display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }
  .alert-box { padding: 14px 16px; border-radius: 10px; font-size: 12.5px; border: 1px solid var(--border); background: var(--surface-2); }
  .warn-box { border-left: 4px solid var(--c-wrn); }
  .info-box { border-left: 4px solid var(--c1); }

  /* Simulator */
  .sim-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 820px) { .sim-grid { grid-template-columns: 1fr; } }
  .sim-controls { display: flex; flex-direction: column; gap: 11px; }
  .sim-row { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .sim-lbl { display: flex; justify-content: space-between; gap: 8px; }
  .sim-row input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .sim-output {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .sim-total-lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
  .sim-total-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; font-weight: 800; color: var(--c-ok); margin-top: 4px; }
  .sim-arr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; font-weight: 700; margin-top: 4px; }
  .sim-delta { font-size: 12px; color: var(--c1); font-weight: 600; margin-top: 4px; }
  .sim-hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .bk-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--border); }

  @media print {
    .topbar-actions, .sidenav { display: none !important; }
    .layout { grid-template-columns: 1fr !important; }
  }
</style>
</head>

</div>

const SESSION_KEY = "exec_brief_raw_key_v1";

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

async function deriveAesKey(passphrase, saltBytes) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveBits", "deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltBytes, iterations: ENCRYPTED_BUNDLE.iter, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    true,
    ["decrypt"]
  );
}

async function renderWithKey(aesKey) {
  const iv = b64ToBytes(ENCRYPTED_BUNDLE.iv);
  const ct = b64ToBytes(ENCRYPTED_BUNDLE.ct);
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, aesKey, ct);
  const payload = JSON.parse(new TextDecoder().decode(plainBuf));
  document.getElementById("lock-screen").style.display = "none";
  const root = document.getElementById("app-root");
  root.innerHTML = payload.html;
  root.style.display = "block";
  const fn = new Function(payload.js);
  fn();
  if (window.initDecryptedApp) window.initDecryptedApp();
}

async function unlockSite(e) {
  e.preventDefault();
  const btn = document.getElementById("unlock-btn");
  const err = document.getElementById("lock-err");
  const pass = document.getElementById("pass-input").value;
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Decrypting…";
  try {
    const salt = b64ToBytes(ENCRYPTED_BUNDLE.salt);
    const key = await deriveAesKey(pass, salt);
    await renderWithKey(key);
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    sessionStorage.setItem(SESSION_KEY, bytesToB64(raw));
  } catch (_) {
    err.textContent = "Incorrect passphrase. Please try again.";
    btn.disabled = false;
    btn.textContent = "Decrypt & Open";
  }
}

window.lockSite = function() {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
};

window.toggleTheme = function() {
  const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", cur);
  localStorage.setItem("exec_brief_theme", cur);
};

(async function boot() {
  const savedTheme = localStorage.getItem("exec_brief_theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

  // Support client-only #p=<passphrase> hash fragment (never sent over HTTP)
  if (location.hash && location.hash.startsWith("#p=")) {
    const hashPass = decodeURIComponent(location.hash.slice(3));
    history.replaceState(null, "", location.pathname + location.search);
    try {
      const salt = b64ToBytes(ENCRYPTED_BUNDLE.salt);
      const key = await deriveAesKey(hashPass, salt);
      await renderWithKey(key);
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      sessionStorage.setItem(SESSION_KEY, bytesToB64(raw));
      return;
    } catch (_) {}
  }

  const cachedKey = sessionStorage.getItem(SESSION_KEY);
  if (cachedKey) {
    try {
      const key = await crypto.subtle.importKey("raw", b64ToBytes(cachedKey), { name: "AES-GCM" }, false, ["decrypt"]);
      await renderWithKey(key);
    } catch (_) {
      sessionStorage.removeItem(SESSION_KEY);
    }
  }
})();
</script>
